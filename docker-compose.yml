# ══════════════════════════════════════════════════════════════════════════════
# CONF-LAVORO SENTINEL AI - FASE 1: MOTORE PERCETTIVO
# COMPOSE UNIFICATO (PC x86_64 e Jetson Orin Nano arm64)
# ══════════════════════════════════════════════════════════════════════════════

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION:-0.17.2}${FRIGATE_IMAGE_SUFFIX}
    restart: unless-stopped
    stop_grace_period: 30s
    runtime: ${DOCKER_RUNTIME:-runc}
    shm_size: "256mb"
    tmpfs:
      - /tmp/cache:size=1g
    volumes:
      # Sincronizzazione fuso orario con l'host (su Linux/Jetson)
      - /etc/localtime:/etc/localtime:ro
      # File di configurazione e cartella cache modelli
      - ./config:/config
      # Registrazioni video (su Jetson puntano all'SSD NVMe tramite STORAGE_RECORDINGS_PATH)
      - ${STORAGE_RECORDINGS_PATH:-./storage/recordings}:/media/frigate/recordings
      # Database SQLite (su Jetson punta all'SSD NVMe tramite STORAGE_DB_PATH)
      - ${STORAGE_DB_PATH:-./storage/db}:/media/frigate/db
      # Snapshot e clip temporanee di evento (persistenza per identikit e rassegna)
      - ${STORAGE_CLIPS_PATH:-./storage/clips}:/media/frigate/clips
      # Opzionale: decommentare su PC Linux con GPU Intel integrata per VAAPI
      # - /dev/dri:/dev/dri
    ports:
      - "8971:8971"             # Interfaccia Web Frigate autenticata (HTTPS) per operatore/LAN
      - "127.0.0.1:5000:5000"   # Interfaccia Web/API interna NON autenticata (solo localhost)
      - "8554:8554"             # Flussi RTSP ritrasmessi da go2rtc
      - "8555:8555/tcp"         # go2rtc WebRTC
      - "8555:8555/udp"         # go2rtc WebRTC
    env_file:
      - .env
    environment:
      # Modello TensorRT generato automaticamente al primo avvio sul Jetson.
      # Il processo di generazione richiede 3-5 minuti: NON riavviare il container.
      - YOLO_MODELS=yolov4-416
    depends_on:
      - mosquitto

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Rilegata esclusivamente a localhost: Frigate e l'orchestratore comunicano
      # tramite rete interna Docker; nessuna esposizione sulla rete delle telecamere.
      - "127.0.0.1:1883:1883"
    volumes:
      # Montaggio dell'INTERA cartella di configurazione (mosquitto.conf + pwfile)
      # per garantire persistenza sull'host ed evitare perdite di credenziali.
      - ./mosquitto/config:/mosquitto/config


  orchestrator:
    container_name: orchestrator
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    # RETE HOST OBBLIGATORIA PER LA DISSUASIONE VOCALE:
    # l'altoparlante Fanvil A233 ascolta un canale MULTICAST RTP (239.255.1.1:5004).
    # Con la rete bridge di Docker i pacchetti multicast restano confinati in docker0
    # e non raggiungono l'interfaccia fisica su cui e' attestato lo speaker.
    # Conseguenze sulla risoluzione dei nomi (gestite con fallback trasparente nel codice):
    #   - il broker MQTT non e' piu' 'mosquitto' ma 127.0.0.1:1883 (porta gia' pubblicata)
    #   - l'API Frigate non e' piu' 'frigate:5000' ma 127.0.0.1:5000 (porta gia' pubblicata)
    network_mode: host
    volumes:
      # Codice orchestratore montato direttamente dall'host per applicazione immediata modifiche
      - ./orchestrator:/app
      # Registro eventi persistente sull'host con rotazione automatica (max 50MB)
      - ./storage/logs:/app/logs
      # Pacchetti audio ufficiali (carmelo e sami) residenti a bordo
      - ./orchestrator/audio:/app/audio:ro
      # Configurazione di runtime e stato detector_status.json (in scrittura)
      - ./config:/config
    # Dispositivi audio fisici (ALSA) per microfono USB / acquisizione ambientale (Passo C)
    devices:
      - /dev/snd:/dev/snd
    env_file:
      - .env
    depends_on:
      - mosquitto

  dashboard:
    container_name: sentinel_dashboard
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    # RETE HOST anche qui: il pulsante "dissuasione vocale" della dashboard usa lo
    # stesso driver multicast RTP dell'orchestratore. In rete bridge il comando
    # risponderebbe "success" senza che dallo speaker esca alcun suono.
    # L'interfaccia Web Commerciale resta raggiungibile dalla LAN sulla porta 8080
    # (DASHBOARD_PORT), che il server apre direttamente sull'host: con network_mode
    # host la sezione 'ports:' non e' ammessa e non serve.
    network_mode: host
    volumes:
      # Codice interfaccia montato dall'host per modifiche e aggiornamenti immediati
      - ./dashboard:/app
      - ./config:/config
      # Driver hardware condivisi con l'orchestratore (relè Modbus + altoparlante Fanvil).
      # Senza questo montaggio server.py non riesce a importarli e i comandi manuali
      # della dashboard rispondono "success" senza pilotare nulla.
      - ./orchestrator:/app/drivers:ro
      # Pacchetti audio ufficiali: unica copia autorevole, condivisa con l'orchestratore
      - ./orchestrator/audio:/app/audio:ro
      - ./storage/logs:/app/logs:ro
      # Database eventi di Frigate in SOLA LETTURA: alimenta /api/events (Archivio Evidenze).
      # Frigate ci scrive di continuo, quindi la dashboard lo apre read-only per non contendere il lock.
      - ${STORAGE_DB_PATH:-./storage/db}:/media/frigate/db:ro
    env_file:
      - .env
    depends_on:
      - orchestrator

