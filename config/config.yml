# ══════════════════════════════════════════════════════════════════════════════
# CONF-LAVORO SENTINEL AI - FASE 1: MOTORE PERCETTIVO
# CONFIGURAZIONE PRINCIPALE FRIGATE (config.yml)
# Verificato rigorosamente su Frigate v0.17.2 Reference
# ══════════════════════════════════════════════════════════════════════════════

# ══════════════════════════════════════════════════════════════════════════════
# ══════ INIZIO PARAMETRI SPECIFICI DEL SITO (CONFIGURAZIONE CLIENTE) ══════
# Questo blocco raggruppa tutti i parametri specifici del cliente e dell'impianto
# che NON supportano la sostituzione automatica da variabili d'ambiente (.env).
# Per installare un nuovo cliente, modificare il file .env e SOLO questo blocco.
# ══════════════════════════════════════════════════════════════════════════════

# A) PIATTAFORMA HARDWARE (ACCELERAZIONE VIDEO DECODIFICA FFMPEG)
# - Su Jetson Orin Nano: la decodifica dei substream 640x360 a 10 fps e' affidata alla CPU ARM
#   (impatto < 3%), eliminando i crash del decoder hardware NVIDIA NvMMLite (Block 261)
#   sui profili H.264 High 5.1 dei flussi Reolink. Il recording 4K non usa decodifica (-c copy).
ffmpeg: {}


# B) CLASSIFICAZIONE EVENTI PER L'ORCHESTRATORE (REVIEW: ALERTS vs DETECTIONS)
# Definisce il livello di severità degli eventi pubblicati su topic frigate/reviews:
# - alerts: generano notifica immediata ed escalation (persone e veicoli non autorizzati)
# - detections: registrati per audit/statistica senza far scattare allarme sonoro
review:
  alerts:
    labels:
      - person
      - car
  detections:
    labels:
      - motorcycle
      - bicycle
      - bus
      - truck

# C) CONSERVAZIONE REGISTRAZIONI (POLITICA SITO - DEFAULT INIZIALE: 3 GIORNI = 72 ORE)
# Modalità di base impostata su 'motion' (zero consumo disco a piazzale vuoto).
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 3      # Giorni di conservazione base su movimento
  alerts:
    pre_capture: 5
    post_capture: 10
    retain:
      days: 3    # Giorni di conservazione clip di allarme
      mode: motion
  detections:
    pre_capture: 5
    post_capture: 10
    retain:
      days: 3    # Giorni di conservazione clip di rilevamento
      mode: motion

# D) ISTANTANEE (SNAPSHOTS)
snapshots:
  enabled: true
  timestamp: false
  bounding_box: true
  crop: false
  retain:
    default: 3   # Giorni di conservazione istantanee

# E) LETTURA TARGHE (LPR) E TARGHE NOTE DEL CLIENTE
lpr:
  enabled: true
  device: CPU
  model_size: small
  detection_threshold: 0.7
  min_area: 1000
  recognition_threshold: 0.9
  min_plate_length: 4
  # Regex standard targa italiana (2 lettere, 3 cifre, 2 lettere, es. AB123CD).
  # Scarta letture spurie o malformate. (N.B. Nello standard ordinario sono escluse I, O, Q, U).
  format: ^[A-Z]{2}[0-9]{3}[A-Z]{2}$
  match_distance: 1
  enhancement: 0
  debug_save_plates: false
  replace_rules: []
  # Elenco targhe autorizzate specifiche dell'azienda cliente.
  # Compilare inserendo la targa e la descrizione identificativa.
  known_plates: {}
  # Esempio di compilazione:
  # known_plates:
  #   AB123CD: "Furgone Magazzino 1"
  #   EF456GH: "Auto Titolare"

# ══════ FINE PARAMETRI SPECIFICI DEL SITO (CONFIGURAZIONE GLOBALE) ══════


# ──────────────────────────────────────────────────────────────────────────────
# 1. DATABASE SQLITE (SU SSD NVMe TRAMITE MOUNT /media/frigate/db)
# ──────────────────────────────────────────────────────────────────────────────
database:
  path: /media/frigate/db/frigate.db

# ──────────────────────────────────────────────────────────────────────────────
# 2. INTEGRAZIONE BROKER MQTT (MOSQUITTO)
# Campi host, user, password risolti nativamente da .env tramite {FRIGATE_...}.
# La porta (1883) non supporta sostituzione ed è cablata come intero standard.
# ──────────────────────────────────────────────────────────────────────────────
mqtt:
  enabled: true
  host: '{FRIGATE_MQTT_HOST}'
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'
  topic_prefix: frigate
  client_id: sentinel_ai_frigate

# ──────────────────────────────────────────────────────────────────────────────
# 3. RILEVATORE PRIMARIO OGGETTI (YOLOv4-416 / TensorRT)
# Generato automaticamente al primo avvio dall'immagine Frigate -tensorrt-jp6.
# Licenza: YOLO LICENSE (pubblico dominio), file LICENSE in
# https://github.com/AlexeyAB/darknet/blob/master/LICENSE
# ──────────────────────────────────────────────────────────────────────────────
detectors:
  tensorrt:
    type: tensorrt
    device: 0

model:
  path: /config/model_cache/tensorrt/yolov4-416.trt
  input_tensor: nchw
  input_pixel_format: rgb
  width: 416
  height: 416
  labelmap_path: /labelmap/coco-80.txt

# ──────────────────────────────────────────────────────────────────────────────
# AGGIORNAMENTO FUTURO: D-FINE / ONNX (Apache 2.0)
# Per attivare questo rilevatore:
# 1. Esportare il modello ONNX con la ricetta ufficiale Frigate
#    (vedi docs/PROCEDURA_ESPORTAZIONE_ONNX.md) su una macchina con
#    almeno 8 GB di RAM liberi e Docker.
# 2. Copiare il file .onnx in config/model_cache/
# 3. Commentare il blocco 'detectors: tensorrt' e 'model:' sopra
# 4. Decommentare il blocco sottostante
# 5. Rimuovere la variabile YOLO_MODELS dal docker-compose.yml
# ──────────────────────────────────────────────────────────────────────────────
# detectors:
#   onnx:
#     type: onnx
#
# model:
#   model_type: dfine
#   width: 640
#   height: 640
#   input_tensor: nchw
#   input_dtype: float
#   path: /config/model_cache/dfine_s_obj2coco.onnx
#   labelmap_path: /labelmap/coco-80.txt


# ──────────────────────────────────────────────────────────────────────────────
# 4. SERVER STREAMING INTERNO (GO2RTC) - PROXY RTSP REOLINK
# Mappa gli stream RTSP definiti nel .env tramite go2rtc.
# ──────────────────────────────────────────────────────────────────────────────
go2rtc:
  streams:
    piazzale_main:
      - '{FRIGATE_CAM_PIAZZALE_MAIN_URL}'
    piazzale_sub:
      - '{FRIGATE_CAM_PIAZZALE_SUB_URL}'

    magazzino_main:
      - '{FRIGATE_CAM_MAGAZZINO_MAIN_URL}'
    magazzino_sub:
      - '{FRIGATE_CAM_MAGAZZINO_SUB_URL}'

    corridoio_main:
      - '{FRIGATE_CAM_CORRIDOIO_MAIN_URL}'
    corridoio_sub:
      - '{FRIGATE_CAM_CORRIDOIO_SUB_URL}'

# ──────────────────────────────────────────────────────────────────────────────
# 5. CONFIGURAZIONE GLOBALE OGGETTI E FILTRI
# ──────────────────────────────────────────────────────────────────────────────
objects:
  track:
    - person
    - car
    - motorcycle
    - bicycle
    - bus
    - truck
  filters:
    person:
      min_score: 0.60
      threshold: 0.75
    car:
      min_score: 0.55
      threshold: 0.70

# ──────────────────────────────────────────────────────────────────────────────
# 6. RICONOSCIMENTO VOLTI (VINCOLO 3: PREDISPOSTO MA DISATTIVATO)
# Modello 'small' (FaceNet) su CPU.
# ──────────────────────────────────────────────────────────────────────────────
face_recognition:
  enabled: false
  unknown_score: 0.8
  detection_threshold: 0.7
  recognition_threshold: 0.9
  min_area: 500
  min_faces: 1
  save_attempts: 200
  blur_confidence_filter: true
  model_size: small
  device: CPU

# ──────────────────────────────────────────────────────────────────────────────
# 7. RILEVAMENTO AUDIO (RUMORI CRITICI DI PERICOLO)
# Ascolto mirato a emergenze fisiche (urla, allarmi antincendio).
# Escluso 'speech' per tutela della privacy e prevenzione falsi allarmi.
# ──────────────────────────────────────────────────────────────────────────────
audio:
  enabled: true
  max_not_heard: 30
  min_volume: 500
  listen:
    - scream
    - yell
    - fire_alarm

# ──────────────────────────────────────────────────────────────────────────────
# 8. CONFIGURAZIONE DELLE TELECAMERE
# ──────────────────────────────────────────────────────────────────────────────
cameras:

  # ─── TELECAMERA 1: PIAZZALE ESTERNO (Entrata Magazzino, Parcheggio, Auto) ──
  piazzale:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/piazzale_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/piazzale_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 10
      min_initialized: 2

    # Lettura targhe opzionale per veicoli in transito piazzale
    lpr:
      enabled: true

# ══════ ZONE TELECAMERA PIAZZALE ESTERNO ══════
    zones:
      zona_entrata_magazzino:
        coordinates: 0.15,0.40,0.85,0.40,0.95,0.95,0.05,0.95
        objects:
          - person
          - car
          - truck
      zona_parcheggio_auto:
        coordinates: 0.40,0.50,0.98,0.50,0.98,0.98,0.40,0.98
        objects:
          - car
          - motorcycle
# ══════ FINE ZONE PIAZZALE ══════

  # ─── TELECAMERA 2: MAGAZZINO INTERNO (Capannone, Scaffali, Bancali) ────────
  magazzino:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/magazzino_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/magazzino_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 10
      min_initialized: 2
    objects:
      track:
        - person

# ══════ ZONE TELECAMERA MAGAZZINO INTERNO ══════
    zones:
      zona_stoccaggio_merci:
        coordinates: 0.10,0.20,0.90,0.20,0.95,0.95,0.05,0.95
        objects:
          - person
# ══════ FINE ZONE MAGAZZINO ══════

  # ─── TELECAMERA 3: CORRIDOIO D'ACCESSO (Passaggio Magazzino - Azienda) ─────
  corridoio:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/corridoio_main
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/corridoio_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
            - audio
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 10
      min_initialized: 2
    objects:
      track:
        - person

# ══════ ZONE TELECAMERA CORRIDOIO ══════
    zones:
      zona_transito_corridoio:
        coordinates: 0.15,0.15,0.85,0.15,0.90,0.95,0.10,0.95
        objects:
          - person
# ══════ FINE ZONE CORRIDOIO ══════
version: 0.17-0
