# ══════════════════════════════════════════════════════════════════════════════
# CONF-LAVORO SENTINEL AI - FASE 1: BROKER MQTT MOSQUITTO
# CONFIGURAZIONE SICURA (mosquitto.conf)
# ══════════════════════════════════════════════════════════════════════════════

# Porta di ascolto interna al container.
# NOTA DI SICUREZZA: Nel docker-compose.yml la porta è esposta esclusivamente
# su 127.0.0.1:1883 e sulla rete interna Docker; il broker NON è raggiungibile
# dalla rete esterna delle telecamere.
listener 1883 0.0.0.0

# Persistenza disabilitata: Frigate ripubblica lo stato alla riconnessione.
# Evita problemi di permessi sul volume host con l'utente non privilegiato di Mosquitto.
persistence false


# Destinazione e livello dei log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ──────────────────────────────────────────────────────────────────────────────
# CONTROLLO ACCESSI E SICUREZZA
# Accesso anonimo TASSATIVAMENTE DISABILITATO.
# Autenticazione obbligatoria tramite file delle password cifrato (/mosquitto/config/pwfile).
# ──────────────────────────────────────────────────────────────────────────────
allow_anonymous false
password_file /mosquitto/config/pwfile
