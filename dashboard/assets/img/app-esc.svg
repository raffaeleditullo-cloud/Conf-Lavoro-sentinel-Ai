<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="tile-bg-esc" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5c1010"/>
      <stop offset="100%" stop-color="#1f0505"/>
    </linearGradient>
    <linearGradient id="tile-border-esc" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tile-shadow-esc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Piastrella Sfondo Professionale High-Tech -->
  <g filter="url(#tile-shadow-esc)">
    <rect x="2" y="2" width="48" height="48" rx="13" fill="url(#tile-bg-esc)" stroke="url(#tile-border-esc)" stroke-width="1.2"/>
    <path d="M12 3.5h28" stroke="#f87171" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Icona Blocco Sessione / Esc Professionale -->
  <g>
    <!-- Arco del lucchetto in acciaio -->
    <path d="M19 21v-5.5a7 7 0 0 1 14 0v5.5" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Corpo del lucchetto corazzato -->
    <rect x="14" y="21" width="24" height="19" rx="4" stroke="#f8fafc" stroke-width="2" fill="rgba(248, 113, 113, 0.18)"/>
    <!-- Serratura biometrica / foro chiave -->
    <circle cx="26" cy="28.5" r="2.2" fill="#f87171"/>
    <path d="M26 30.5v4" stroke="#f87171" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
