<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="event-violet" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d1a8ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>
    <filter id="event-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9d4edd" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Icona Registro Eventi & Video NAS Senza Sfondo -->
  <g filter="url(#event-glow)">
    <!-- Cartella / Nastro video delle registrazioni -->
    <path d="M8 10a4 4 0 0 1 4-4h14l4 4h10a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V10z" 
          stroke="url(#event-violet)" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
    <!-- Finestra clip video centrale -->
    <rect x="13" y="17" width="22" height="15" rx="3" stroke="url(#event-violet)" stroke-width="2" fill="none"/>
    <!-- Freccia Play centrale -->
    <polygon points="21,21 28,24.5 21,28" fill="#ffffff" opacity="0.95"/>
    <!-- Tracce di registrazione audio/video sul fondo -->
    <line x1="14" y1="36" x2="18" y2="36" stroke="#d1a8ff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="22" y1="36" x2="30" y2="36" stroke="#d1a8ff" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="33" y1="36" x2="34" y2="36" stroke="#d1a8ff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
