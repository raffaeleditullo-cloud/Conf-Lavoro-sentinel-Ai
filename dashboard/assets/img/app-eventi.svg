<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="tile-bg-events" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241d4f"/>
      <stop offset="100%" stop-color="#0c0a21"/>
    </linearGradient>
    <linearGradient id="tile-border-events" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tile-shadow-events" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Piastrella Sfondo Professionale High-Tech -->
  <g filter="url(#tile-shadow-events)">
    <rect x="2" y="2" width="48" height="48" rx="13" fill="url(#tile-bg-events)" stroke="url(#tile-border-events)" stroke-width="1.2"/>
    <path d="M12 3.5h28" stroke="#c084fc" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Icona Registro Eventi & Video NAS Professionale -->
  <g>
    <!-- Scheda registrazione / archivio -->
    <rect x="13" y="14" width="26" height="24" rx="4" stroke="#f8fafc" stroke-width="2" fill="rgba(192, 132, 252, 0.12)"/>
    <!-- Linea traccia superiore -->
    <line x1="13" y1="21" x2="39" y2="21" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
    <!-- Tacche di marcatura video audit -->
    <rect x="16" y="16" width="3" height="3" rx="0.6" fill="#c084fc"/>
    <rect x="24.5" y="16" width="3" height="3" rx="0.6" fill="#c084fc"/>
    <rect x="33" y="16" width="3" height="3" rx="0.6" fill="#c084fc"/>
    <!-- Simbolo Play audit centrale -->
    <polygon points="23,26 31,30.5 23,35" fill="#f8fafc"/>
  </g>
</svg>
