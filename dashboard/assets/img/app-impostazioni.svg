<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="tile-bg-settings" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tile-border-settings" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tile-shadow-settings" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Piastrella Sfondo Professionale High-Tech -->
  <g filter="url(#tile-shadow-settings)">
    <rect x="2" y="2" width="48" height="48" rx="13" fill="url(#tile-bg-settings)" stroke="url(#tile-border-settings)" stroke-width="1.2"/>
    <path d="M12 3.5h28" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Icona Impostazioni & Parametri di Sistema Professionale -->
  <g>
    <!-- Ingranaggio di precisione centrale -->
    <circle cx="26" cy="24" r="5.5" stroke="#f8fafc" stroke-width="2" fill="rgba(251, 191, 36, 0.15)"/>
    <circle cx="26" cy="24" r="2.2" fill="#fbbf24"/>
    <!-- Denti dell'ingranaggio a 90° e 45° -->
    <path d="M26 13v3.5m0 15v3.5M15 24h3.5m15 0h3.5M18.2 16.2l2.5 2.5m10.6 10.6l2.5 2.5M18.2 31.8l2.5-2.5m10.6-10.6l2.5-2.5"
          stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Cursore slider di precisione volume Fanvil / orari in basso -->
    <line x1="16" y1="39" x2="36" y2="39" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="39" r="2.5" fill="#fbbf24" stroke="#0f172a" stroke-width="1"/>
  </g>
</svg>
