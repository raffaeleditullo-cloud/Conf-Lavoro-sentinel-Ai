<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cloud-blue" x1="6" y1="8" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Icona Cloud & Rete Senza Sfondo -->
  <g filter="url(#cloud-glow)">
    <!-- Sagoma Nuvola Connettori -->
    <path d="M35 34h3a7 7 0 0 0 1-13.9 11 11 0 0 0-21-3.6A8 8 0 0 0 10 32.5a6 6 0 0 0 6 5.5h19"
          stroke="url(#cloud-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Nodi di rete e sincronizzazione centrale -->
    <circle cx="24" cy="27" r="3" stroke="#ffffff" stroke-width="2" fill="#38bdf8"/>
    <circle cx="17" cy="33" r="2.2" stroke="url(#cloud-blue)" stroke-width="1.8" fill="#ffffff"/>
    <circle cx="31" cy="33" r="2.2" stroke="url(#cloud-blue)" stroke-width="1.8" fill="#ffffff"/>
    <!-- Linee di connessione bus dati -->
    <line x1="19" y1="31.5" x2="22" y2="28.5" stroke="#38bdf8" stroke-width="1.8"/>
    <line x1="26" y1="28.5" x2="29" y2="31.5" stroke="#38bdf8" stroke-width="1.8"/>
  </g>
</svg>
