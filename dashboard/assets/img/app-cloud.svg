<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="tile-bg-cloud" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03456b"/>
      <stop offset="100%" stop-color="#021c2e"/>
    </linearGradient>
    <linearGradient id="tile-border-cloud" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tile-shadow-cloud" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Piastrella Sfondo Professionale High-Tech -->
  <g filter="url(#tile-shadow-cloud)">
    <rect x="2" y="2" width="48" height="48" rx="13" fill="url(#tile-bg-cloud)" stroke="url(#tile-border-cloud)" stroke-width="1.2"/>
    <path d="M12 3.5h28" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Icona Connettori Cloud & Rete Professionale -->
  <g>
    <!-- Sagoma Nuvola Enterprise -->
    <path d="M35 33h2.5a5.5 5.5 0 0 0 1-10.9 8.5 8.5 0 0 0-16.2-2.6A6.5 6.5 0 0 0 13.5 31a4.5 4.5 0 0 0 4.5 4h17"
          stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(56, 189, 248, 0.12)"/>
    <!-- Freccia di sincronizzazione dati bidirezionale -->
    <path d="M23 27.5l3-3 3 3" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="26" y1="25" x2="26" y2="33" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
