<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Gradiente primario Cybernetic ORIN (Ciano Elettrico / Deep Azure) -->
    <linearGradient id="orin-cyan-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0044cc"/>
    </linearGradient>

    <!-- Gradiente Iride ORIN -->
    <radialGradient id="orin-iris-core" cx="24" cy="24" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001438"/>
      <stop offset="45%" stop-color="#003888"/>
      <stop offset="75%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </radialGradient>

    <!-- Bagliore laser Cybernetic -->
    <filter id="orin-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00d4ff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#orin-logo-glow)">
    <!-- Anello esterno segmentato "O" di ORIN -->
    <path d="M24 4 A20 20 0 0 1 44 24" stroke="url(#orin-cyan-grad)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M44 24 A20 20 0 0 1 24 44" stroke="url(#orin-cyan-grad)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="26 6"/>
    <path d="M24 44 A20 20 0 0 1 4 24" stroke="url(#orin-cyan-grad)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M4 24 A20 20 0 0 1 24 4" stroke="url(#orin-cyan-grad)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="26 6"/>

    <!-- Tacche di telemetria orbitale ai 4 assi -->
    <line x1="24" y1="1" x2="24" y2="3.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="47" y1="24" x2="44.5" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="47" x2="24" y2="44.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="1" y1="24" x2="3.5" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- L'Occhio Sentinella di ORIN (Nucleo sintetico) -->
    <circle cx="24" cy="24" r="13" fill="url(#orin-iris-core)" stroke="#00f0ff" stroke-width="1.6"/>
    
    <!-- Pupilla e riflesso speculare -->
    <circle cx="24" cy="24" r="6" fill="#040914"/>
    <circle cx="21.5" cy="21.5" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="26" cy="26" r="1" fill="#00f0ff" opacity="0.8"/>

    <!-- Raggi neurali dell'iride -->
    <line x1="24" y1="13" x2="24" y2="16" stroke="#00f0ff" stroke-width="1.2" opacity="0.75"/>
    <line x1="24" y1="32" x2="24" y2="35" stroke="#00f0ff" stroke-width="1.2" opacity="0.75"/>
    <line x1="13" y1="24" x2="16" y2="24" stroke="#00f0ff" stroke-width="1.2" opacity="0.75"/>
    <line x1="32" y1="24" x2="35" y2="24" stroke="#00f0ff" stroke-width="1.2" opacity="0.75"/>
  </g>
</svg>
