<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="tile-bg-plates" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022118"/>
    </linearGradient>
    <linearGradient id="tile-border-plates" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tile-shadow-plates" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Piastrella Sfondo Professionale High-Tech -->
  <g filter="url(#tile-shadow-plates)">
    <rect x="2" y="2" width="48" height="48" rx="13" fill="url(#tile-bg-plates)" stroke="url(#tile-border-plates)" stroke-width="1.2"/>
    <path d="M12 3.5h28" stroke="#34d399" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Icona Whitelist Targhe LPR Professionale -->
  <g>
    <!-- Mirino di scansione ottica OCR ai 4 angoli -->
    <path d="M12 18v-3a2 2 0 0 1 2-2h3" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M35 13h3a2 2 0 0 1 2 2v3" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M12 34v3a2 2 0 0 0 2 2h3" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M35 39h3a2 2 0 0 0 2-2v-3" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Targa veicolo centrata -->
    <rect x="15" y="20" width="22" height="12" rx="2.5" stroke="#f8fafc" stroke-width="1.8" fill="rgba(52, 211, 153, 0.15)"/>
    <!-- Banda blu europea -->
    <rect x="16.5" y="21.5" width="2.8" height="9" rx="0.5" fill="#2563eb"/>
    <!-- Caratteri alfanumerici della targa -->
    <line x1="22" y1="26" x2="25" y2="26" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="26" x2="33" y2="26" stroke="#f8fafc" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
