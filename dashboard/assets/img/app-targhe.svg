<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="plate-emerald" x1="4" y1="6" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00ffb4"/>
      <stop offset="50%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <filter id="plate-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00e676" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Icona Whitelist Targhe LPR Senza Sfondo -->
  <g filter="url(#plate-glow)">
    <!-- Sagoma frontale veicolo -->
    <path d="M12 18l3-8a3 3 0 0 1 2.8-2h12.4a3 3 0 0 1 2.8 2l3 8" stroke="url(#plate-emerald)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M8 22c0-2.2 1.8-4 4-4h24c2.2 0 4 1.8 4 4v12a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3v-1H16v1a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3V22z"
          stroke="url(#plate-emerald)" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
    <!-- Fari anteriori del veicolo -->
    <circle cx="13" cy="23" r="2.2" stroke="#ffffff" stroke-width="1.8" fill="#00ffb4"/>
    <circle cx="35" cy="23" r="2.2" stroke="#ffffff" stroke-width="1.8" fill="#00ffb4"/>
    <!-- Targa automobilistica scansionata (LPR) -->
    <rect x="16" y="27" width="16" height="7" rx="1.5" stroke="#ffffff" stroke-width="1.6" fill="rgba(0, 200, 83, 0.2)"/>
    <!-- Tacche caratteri targa -->
    <line x1="19" y1="30.5" x2="22" y2="30.5" stroke="#00ffb4" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="24" y1="30.5" x2="29" y2="30.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
