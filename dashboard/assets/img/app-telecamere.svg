<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="tile-bg-cam" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="tile-border-cam" x1="0" y1="0" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tile-shadow-cam" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Piastrella Sfondo Professionale High-Tech -->
  <g filter="url(#tile-shadow-cam)">
    <rect x="2" y="2" width="48" height="48" rx="13" fill="url(#tile-bg-cam)" stroke="url(#tile-border-cam)" stroke-width="1.2"/>
    <!-- Riflesso bordo superiore sottile -->
    <path d="M12 3.5h28" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Icona Telecamera Sorveglianza Professionale -->
  <g>
    <!-- Chassis fotocamera -->
    <rect x="12" y="16" width="18" height="18" rx="3.5" stroke="#f8fafc" stroke-width="2" fill="rgba(56, 189, 248, 0.12)"/>
    <!-- Obiettivo e lenti ottiche -->
    <circle cx="21" cy="25" r="4.8" stroke="#38bdf8" stroke-width="1.8" fill="#0b1329"/>
    <circle cx="21" cy="25" r="1.8" fill="#38bdf8"/>
    <!-- Cono obiettivo di puntamento -->
    <path d="M30 20.5l9-5.5v19l-9-5.5" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(56, 189, 248, 0.08)"/>
    <!-- LED di stato sicurezza attivo -->
    <circle cx="16" cy="20" r="1.3" fill="#ef4444"/>
  </g>
</svg>
